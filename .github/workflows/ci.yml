name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p ui/tsconfig.json
      - run: npm run build
      - run: npm pack --ignore-scripts
      - run: npm run test:release -- ./angine-0.1.0.tgz
